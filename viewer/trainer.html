<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр Ева</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@500;600&display=swap">
<style>
/* Exercise player for embedding: the body fills the frame; the prompt of the moment is the largest text;
   one control bar at the bottom. Same palette as the anatomy viewer. */
:root{
  --bg:#e6ecef; --stage-a:#f3f6f7; --stage-b:#d7e0e4; --panel:#f8fafb; --ink:#14212a; --muted:#576873; --line:#cdd7dc;
  --accent:#0d6b76; --accent-ink:#ffffff; --hl:#d98e04; --chip:#e9eff1;
  --f-display:"Spectral",Georgia,serif; --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1318; --stage-a:#15232b; --stage-b:#081015; --panel:#111c23; --ink:#dce6eb; --muted:#8c9fa9; --line:#22343e;
  --accent:#4cb3be; --accent-ink:#06171b; --hl:#f0b64a; --chip:#182730; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1318; --stage-a:#15232b; --stage-b:#081015; --panel:#111c23; --ink:#dce6eb; --muted:#8c9fa9; --line:#22343e;
  --accent:#4cb3be; --accent-ink:#06171b; --hl:#f0b64a; --chip:#182730; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
#stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b))}
.top{position:absolute;z-index:2;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
.top h1{margin:0;font:600 1.25rem/1.15 var(--f-display)}
.top .rep{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.say{font:700 clamp(1.15rem,3.2vw,1.7rem)/1.2 var(--f-ui);color:var(--accent);max-width:34ch;min-height:1.2em;text-wrap:balance}
.goal{margin:0;color:var(--muted);font-size:.9rem;max-width:44ch}
.side{position:absolute;z-index:2;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));width:min(300px,34vw);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.side ul{margin:0;padding-left:1.1em}
.side .mus b{font-weight:700}
.side .note{font-size:.72rem;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:6px}
.bar{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 12px 30px -20px rgba(10,30,40,.55)}
select,.num{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;font:500 .92rem var(--f-ui);padding:8px 10px;min-height:40px}
select{flex:1 1 220px;min-width:0}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 .95rem var(--f-ui);padding:9px 16px;min-height:40px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.grp{display:flex;gap:6px;align-items:center}
.grp label{font-size:.8rem;color:var(--muted)}
.num{width:4.2em;text-align:center;font-family:var(--f-mono)}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:var(--bg);font:600 1.05rem var(--f-display)}
.loading .bar2{display:block;width:220px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 0;overflow:hidden}
.loading i{display:block;height:100%;width:0;background:var(--accent)}
/* compact embedding: ?ui=min hides the side card and the selector */
body.min .side, body.min #ex{display:none}
@media (max-width:700px){
  .side{display:none}
  .goal{display:none}
  .bar{gap:6px}
  .grp label{display:none}
}
</style>
</head>
<body>
<div id="stage" aria-label="3D-модель выполняет упражнение"></div>
<header class="top">
  <h1 id="title">Упражнение</h1>
  <span class="rep" id="rep"></span>
  <span class="rep" id="disc" hidden></span>
  <div class="say" id="say" aria-live="polite"></div>
  <p class="goal" id="goal"></p>
</header>
<aside class="side" id="side">
  <ul id="cues"></ul>
  <p class="mus" id="mus"></p>
  <p class="note" id="note"></p>
</aside>
<nav class="bar" aria-label="Управление">
  <select id="ex" aria-label="Упражнение"></select>
  <button class="btn" id="play">Старт</button>
  <button class="btn ghost" id="stop">Стоп</button>
  <div class="grp"><label for="reps">Повторы</label><input class="num" id="reps" type="number" min="1" max="30" value="5"></div>
  <div class="grp"><label for="speed">Темп</label><select id="speed" class="num" style="width:auto"><option value=".7">медленно</option><option value="1" selected>обычно</option><option value="1.3">быстро</option></select></div>
  <button class="btn ghost" id="voice" aria-pressed="false" title="Подсказки голосом">Голос</button>
  <button class="btn ghost" id="layer" aria-pressed="false" title="Показать мышцы">Мышцы</button>
</nav>
<div class="loading" id="loading"><div>Загружаю модель<span class="bar2"><i id="prog"></i></span></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// Exercise player. URL: ?exercise=bridge&reps=5&speed=1&autoplay=1&voice=1&layer=muscles&ui=min&theme=dark
// From a parent page: postMessage({type:"body_command", commands:[...]}) as in the viewer; this page reports
// {type:"body_event", event:"motion"|"motion-end", detail} to its parent.
import { HumanBody, EXERCISES } from "./body.js";
import { Commander } from "./commands.js";
import { INFO, NOTE } from "./exercises-ru.js";
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");
if (Q.get("ui") === "min") document.body.classList.add("min");

let wasm = true; try { await WebAssembly.compile(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); } catch (e) { wasm = false; }
const body = new HumanBody($("stage"), { url: window.BODY_MODEL_URL || "human.glb", draco: "draco/", dracoType: wasm ? "wasm" : "js" });
const cmd = new Commander(body);
window.Body = { body, run: c => cmd.run(c) };

// exercises in the selector (hidden helper sequences excluded), plus walking
const LIST = Object.entries(EXERCISES).filter(([, v]) => !v.hidden).map(([k, v]) => [k, v.ru]).concat([["walk", "Ходьба на месте"]]);
$("ex").innerHTML = LIST.map(([k, ru]) => `<option value="${k}">${ru}</option>`).join("");
const pick = Q.get("exercise"); if (pick && LIST.some(([k]) => k === pick)) $("ex").value = pick;
if (Q.get("reps")) $("reps").value = Math.max(1, Math.min(30, +Q.get("reps") || 5));
if (Q.get("speed")) $("speed").value = [".7", "1", "1.3"].reduce((a, v) => Math.abs(v - Q.get("speed")) < Math.abs(a - Q.get("speed")) ? v : a, "1");

// voice: the browser's own speech, Russian voice when there is one; only after the first click (browsers require it)
let voiceOn = Q.get("voice") === "1", lastSaid = "", unlocked = false;
const ruVoice = () => (speechSynthesis.getVoices() || []).find(v => /^ru/i.test(v.lang));
function speak(text) {
  if (!voiceOn || !unlocked || !text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ru-RU"; const v = ruVoice(); if (v) u.voice = v; u.rate = 1.02; speechSynthesis.speak(u);
}
const setVoice = on => { voiceOn = on; $("voice").setAttribute("aria-pressed", on); if (!on && "speechSynthesis" in window) speechSynthesis.cancel(); };
setVoice(voiceOn);

function showInfo(key) {
  const I = INFO[key], name = (EXERCISES[key] && EXERCISES[key].ru) || (key === "walk" ? "Ходьба на месте" : key);
  $("title").textContent = name; $("goal").textContent = I ? I.goal : "";
  $("cues").innerHTML = I ? I.cues.map(c => `<li>${c}</li>`).join("") : "";
  $("mus").innerHTML = I ? "<b>Работают:</b> " + I.muscles.map(m => m[1]).join(", ") : "";
  $("note").textContent = I ? (I.caution ? I.caution + " " : "") + NOTE : NOTE;
  if (layerOn && I) body.highlightMany(I.muscles.map(m => m[0]));
}
let layerOn = Q.get("layer") === "muscles", state = "idle";
function setLayer(on) {
  layerOn = on; $("layer").setAttribute("aria-pressed", on);
  body.peel(on ? "muscles_bones" : "skin"); body.clearHighlight();
  const I = INFO[$("ex").value]; if (on && I) body.highlightMany(I.muscles.map(m => m[0]));
}
function setState(s) { state = s; $("play").textContent = s === "playing" ? "Пауза" : s === "paused" ? "Дальше" : "Старт"; }

function start() {
  const k = $("ex").value; showInfo(k); body.stopMotion(); body.pauseMotion(false);
  if (k === "walk") body.walk(true, +$("speed").value); else body.exercise(k, +$("reps").value, +$("speed").value);
  setState("playing");
}
$("play").onclick = () => {
  unlocked = true;
  if (state === "playing") { body.pauseMotion(true); if ("speechSynthesis" in window) speechSynthesis.cancel(); setState("paused"); }
  else if (state === "paused") { body.pauseMotion(false); setState("playing"); }
  else start();
};
$("stop").onclick = () => { body.stopMotion(); body.preset("stand"); setState("idle"); $("say").textContent = ""; $("rep").textContent = ""; };
$("ex").onchange = () => { showInfo($("ex").value); if (state !== "idle") start(); };
$("voice").onclick = () => { unlocked = true; setVoice(!voiceOn); if (voiceOn) speak($("say").textContent || "Голос включён"); };
$("layer").onclick = () => setLayer(!layerOn);
// ?spine=1: colour the spine and show the estimated L4-L5 disc pressure (Wilke 1999)
if (Q.get("spine") === "1") { $("disc").hidden = false; setInterval(() => { if (!body.root) return; const d = body.spineState().disc; $("disc").textContent = `диск L4–L5 ≈ ${d.pctOfStanding} % от стоя (${d.basis.startsWith("измерено") ? "измерено" : "оценка"})`; }, 300); }

body.addEventListener("motion", e => {
  const d = e.detail;
  $("rep").textContent = d.reps ? `повтор ${d.rep} из ${d.reps}` : "";
  if (d.say !== lastSaid) { lastSaid = d.say; $("say").textContent = d.say || ""; speak(d.say); }
  if (window.parent !== window) window.parent.postMessage({ type: "body_event", event: "motion", detail: d }, "*");
});
body.addEventListener("motion-end", e => {
  if (!e.detail || !e.detail.stopped) { $("say").textContent = "Готово"; speak("Готово"); }
  setState("idle"); lastSaid = "";
  if (window.parent !== window) window.parent.postMessage({ type: "body_event", event: "motion-end", detail: e.detail }, "*");
});
addEventListener("message", e => {
  const d = e.data; if (!d || d.type !== "body_command") return;
  let results; try { results = cmd.run(d.commands || d.command); } catch (err) { results = { ok: false, error: String(err.message || err) }; }
  if (e.source) e.source.postMessage({ type: "body_result", id: d.id, results }, e.origin === "null" ? "*" : e.origin);
});

try {
  await body.load(p => ($("prog").style.width = Math.round(p * 100) + "%"));
  $("loading").hidden = true; body.peel("skin"); body.live = true; showInfo($("ex").value); setLayer(layerOn);
  if (Q.get("spine") === "1") body.showSpine(true);
  if (Q.get("autoplay") === "1") start();
} catch (err) { $("loading").querySelector("div").textContent = "Не удалось загрузить модель: " + (err.message || err); }
</script>
</body>
</html>
