<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Здоровая спина</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@500;600&display=swap">
<style>
/* A short course: lessons in a column on the left, the body on a light stage, the prompt of the moment and the
   disc gauge over the stage. Same palette as the anatomy viewer. */
:root{
  --bg:#e6ecef; --stage-a:#f3f6f7; --stage-b:#d7e0e4; --panel:#f8fafb; --ink:#14212a; --muted:#576873; --line:#cdd7dc;
  --accent:#0d6b76; --accent-ink:#ffffff; --hl:#d98e04; --chip:#e9eff1; --ok:#3a8f57;
  --f-display:"Spectral",Georgia,serif; --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1318; --stage-a:#15232b; --stage-b:#081015; --panel:#111c23; --ink:#dce6eb; --muted:#8c9fa9; --line:#22343e;
  --accent:#4cb3be; --accent-ink:#06171b; --hl:#f0b64a; --chip:#182730; --ok:#5fbf7f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1318; --stage-a:#15232b; --stage-b:#081015; --panel:#111c23; --ink:#dce6eb; --muted:#8c9fa9; --line:#22343e;
  --accent:#4cb3be; --accent-ink:#06171b; --hl:#f0b64a; --chip:#182730; --ok:#5fbf7f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);overflow:hidden;display:grid;grid-template-columns:360px 1fr;height:100dvh}
[hidden]{display:none!important}
aside{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
.head{padding:16px 18px 10px}
.head h1{margin:0;font:600 1.45rem/1.15 var(--f-display)}
.head p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
ol.lessons{list-style:none;margin:0;padding:4px 10px 10px;overflow:auto;flex:0 0 auto;max-height:42%;border-bottom:1px solid var(--line)}
ol.lessons button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);
  font:500 .92rem var(--f-ui);padding:8px;border-radius:10px;cursor:pointer}
ol.lessons button:hover{background:var(--chip)}
ol.lessons button[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font:600 .78rem var(--f-mono)}
.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.dur{font:500 .75rem var(--f-mono);color:var(--muted)}
.lesson{padding:14px 18px 18px;overflow:auto;flex:1 1 auto;display:flex;flex-direction:column;gap:10px}
.lesson h2{margin:0;font:600 1.2rem/1.2 var(--f-display)}
.lesson p{margin:0}
.lesson ul{margin:0;padding-left:1.15em}
.lesson .muted{color:var(--muted);font-size:.84rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 .95rem var(--f-ui);padding:9px 16px;min-height:40px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
main{position:relative;min-width:0}
#stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 55% 35%,var(--stage-a),var(--stage-b))}
.hud{position:absolute;z-index:2;left:16px;right:16px;top:14px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.say{font:700 clamp(1.05rem,2.3vw,1.5rem)/1.25 var(--f-ui);color:var(--accent);max-width:40ch;text-wrap:balance;min-height:1.25em}
.spinetext{font-size:.86rem;color:var(--muted);max-width:60ch}
.gauge{position:absolute;z-index:2;left:16px;bottom:16px;width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.gauge b{font:600 1rem var(--f-mono);font-variant-numeric:tabular-nums}
.gauge .meter{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.gauge .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fae5a,#d98e04,#c8442a);transition:width .3s}
.gauge small{color:var(--muted);font-size:.74rem}
.gauge a{color:inherit}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:var(--bg);font:600 1.05rem var(--f-display)}
.loading .bar{display:block;width:220px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 0;overflow:hidden}
.loading i{display:block;height:100%;width:0;background:var(--accent)}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:52dvh minmax(0,1fr);overflow:hidden}
  main{grid-row:1} aside{grid-row:2;border-right:0;border-top:1px solid var(--line);min-height:0}
  .head{display:none}
  ol.lessons{display:flex;gap:4px;overflow-x:auto;max-height:none;padding:8px;flex:0 0 auto}
  ol.lessons li{flex:0 0 auto}
  ol.lessons button{grid-template-columns:24px auto;padding:6px 10px;white-space:nowrap}
  ol.lessons .dur{display:none}
  .gauge{left:10px;bottom:10px;padding:8px 10px}
  .hud{left:10px;right:10px;top:8px}
  .spinetext{display:none}
}
</style>
</head>
<body>
<aside>
  <header class="head"><h1>Здоровая спина</h1><p>Короткий курс на 3D-модели: как устроен позвоночник, что его нагружает и как беречь поясницу.</p></header>
  <ol class="lessons" id="list" aria-label="Уроки"></ol>
  <section class="lesson" id="lesson" aria-live="polite">
    <h2 id="lTitle"></h2>
    <p id="lText"></p>
    <ul id="lCues"></ul>
    <div class="prog" aria-hidden="true"><i id="bar"></i></div>
    <div class="row">
      <button class="btn" id="play">Смотреть</button>
      <button class="btn ghost" id="next">Следующий урок →</button>
      <button class="btn ghost" id="voice" aria-pressed="false">Голос</button>
    </div>
    <p class="muted" id="lCaution"></p>
    <p class="muted" id="note"></p>
  </section>
</aside>
<main>
  <div id="stage" aria-label="3D-модель показывает урок"></div>
  <div class="hud"><div class="say" id="say"></div><div class="spinetext" id="spinetext"></div></div>
  <div class="gauge" id="gauge"><span class="muted" style="font-size:.8rem">Давление в диске L4–L5</span><b id="gVal">—</b><span class="meter"><i id="gBar"></i></span>
    <small><span id="gBasis"></span> · <a href="https://pubmed.ncbi.nlm.nih.gov/10222525/" target="_blank" rel="noopener">Wilke 1999</a>, <a href="https://doi.org/10.1016/S0268-0033(00)00103-0" target="_blank" rel="noopener">2001</a></small></div>
  <div class="loading" id="loading"><div>Загружаю модель<span class="bar"><i id="prog"></i></span></div></div>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// "Healthy back" course. URL: ?lesson=lifting&autoplay=1&voice=1&theme=dark. Reports {type:"body_event"} to a parent page
// and accepts {type:"body_command"} like the viewer.
import { HumanBody, EXERCISES } from "./body.js";
import { Commander } from "./commands.js";
import { INFO, NOTE } from "./exercises-ru.js";
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");

const COURSE = [
  { id: "tour", ex: "spine_tour", title: "Как устроен позвоночник", text: "Позвоночник держит тело, защищает спинной мозг и даёт двигаться. Посмотрите на отделы, диски и место, где нагрузка самая большая." },
  { id: "posture", ex: "posture_types", title: "Осанка", text: "Изгибы позвоночника — норма. Важна их величина: при сутулости, гиперлордозе или плоской спине нагрузка распределяется хуже." },
  { id: "scoliosis", ex: "scoliosis_adams", title: "Сколиоз", text: "Сколиоз — боковое искривление с поворотом позвонков. Простой тест наклоном вперёд помогает его заметить; диагноз ставит врач." },
  { id: "sitting", ex: "sitting_postures", title: "Как сидеть", text: "Сидя диск нагружен почти так же, как стоя, а согнувшись — почти вдвое больше. Главное — менять позу и вставать." },
  { id: "stand_up", ex: "sit_to_stand", title: "Как встать со стула", text: "Вставать ногами, а не рывком спины: корпус вперёд, стопы под коленями, толчок ногами." },
  { id: "lifting", ex: "lift_compare", title: "Как поднимать груз", text: "Сравните два подъёма 20 кг: с круглой спиной давление в поясничном диске около 2,3 МПа, в приседе — около 1,7, груз у тела — около 1,1." },
  { id: "floor", ex: "lower_back", title: "Упражнения для поясницы", text: "Комплекс на полу: колени к груди, мостик, кошка — корова, птица-собака. Медленно и без боли." },
  { id: "standing", ex: "lower_back_standing", title: "Разминка стоя", text: "Если лечь негде: мягкая подвижность поясницы стоя во всех направлениях." }
];
let wasm = true; try { await WebAssembly.compile(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); } catch (e) { wasm = false; }
const body = new HumanBody($("stage"), { url: window.BODY_MODEL_URL || "human.glb", draco: "draco/", dracoType: wasm ? "wasm" : "js",
  shape: Object.fromEntries(["breast", "weight", "muscle"].map(k => [k, +new URLSearchParams(location.search).get(k) || 0])) });   // ?breast=&weight=&muscle= from -1 to 1
const cmd = new Commander(body); window.Body = { body, run: c => cmd.run(c) };

// progress is a per-viewer convenience: it may be unavailable (private mode), the page works without it
const done = new Set(); try { JSON.parse(localStorage.getItem("spine-course-done") || "[]").forEach(x => done.add(x)); } catch (e) {}
const saveDone = () => { try { localStorage.setItem("spine-course-done", JSON.stringify([...done])); } catch (e) {} };

// lesson length from the exercise frames (seconds), shown in the list
const secs = ex => { const E = EXERCISES[ex], one = X => (X.frames.reduce((a, f) => a + (f.dur || 1) + (f.hold || 0), 0)) * (X.loop || 1) + (X.end ? (X.end.dur || 1) : 0);
  return Math.round(E.program ? E.program.reduce((a, n) => a + one(EXERCISES[n]), 0) : one(E)); };
const fmt = s => s >= 60 ? Math.floor(s / 60) + " мин " + (s % 60 ? (s % 60) + " с" : "") : s + " с";
function drawList() {
  $("list").innerHTML = COURSE.map((c, i) => `<li><button data-i="${i}" class="${done.has(c.id) ? "done" : ""}" aria-current="${i === cur}"><span class="num">${done.has(c.id) ? "✓" : i + 1}</span><span>${c.title}</span><span class="dur">${fmt(secs(c.ex))}</span></button></li>`).join("");
  $("list").querySelectorAll("button").forEach(b => b.onclick = () => { select(+b.dataset.i); play(); });
}
let cur = Math.max(0, COURSE.findIndex(c => c.id === Q.get("lesson"))), playing = false, lastSaid = "", voiceOn = Q.get("voice") === "1", unlocked = false;
function select(i) {
  cur = i; const c = COURSE[i], I = INFO[c.ex] || {};
  $("lTitle").textContent = (i + 1) + ". " + c.title; $("lText").textContent = c.text;
  $("lCues").innerHTML = (I.cues || []).map(x => `<li>${x}</li>`).join(""); $("lCaution").textContent = I.caution || ""; $("note").textContent = NOTE;
  $("next").hidden = i >= COURSE.length - 1; $("say").textContent = ""; $("spinetext").textContent = ""; $("bar").style.width = "0";
  body.stopMotion(); body.showSpine(false); body.clearHighlight(); body.peel("skin"); body.preset("stand"); playing = false; $("play").textContent = "Смотреть";
  drawList(); history.replaceState(null, "", "?" + new URLSearchParams({ ...Object.fromEntries(Q), lesson: c.id }));
}
function play() { unlocked = true; const c = COURSE[cur]; body.stopMotion(); body.exercise(c.ex); playing = true; $("play").textContent = "Сначала"; }
$("play").onclick = play;
$("next").onclick = () => { select(Math.min(COURSE.length - 1, cur + 1)); play(); };
const ruVoice = () => (speechSynthesis.getVoices() || []).find(v => /^ru/i.test(v.lang));
function speak(t) { if (!voiceOn || !unlocked || !t || !("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "ru-RU"; const v = ruVoice(); if (v) u.voice = v; speechSynthesis.speak(u); }
const setVoice = on => { voiceOn = on; $("voice").setAttribute("aria-pressed", on); if (!on && "speechSynthesis" in window) speechSynthesis.cancel(); };
$("voice").onclick = () => { unlocked = true; setVoice(!voiceOn); if (voiceOn) speak($("say").textContent || "Голос включён"); };
setVoice(voiceOn);

const RN = { cervical: "шейный", thoracic: "грудной", lumbar: "поясничный" };
const describe = r => { const p = [];
  if (Math.abs(r.flex) >= 3) p.push((r.flex > 0 ? "сгибание " : "разгибание ") + Math.abs(r.flex) + "°");
  if (Math.abs(r.side) >= 3) p.push("наклон " + (r.side > 0 ? "вправо " : "влево ") + Math.abs(r.side) + "°");
  if (Math.abs(r.twist) >= 3) p.push("поворот " + (r.twist > 0 ? "влево " : "вправо ") + Math.abs(r.twist) + "°");
  return p.join(", ") || "нейтрально"; };
body.addEventListener("motion", e => {
  const d = e.detail; if (d.say !== lastSaid) { lastSaid = d.say; $("say").textContent = d.say || ""; speak(d.say); }
  if (window.parent !== window) window.parent.postMessage({ type: "body_event", event: "motion", detail: { ...d, lesson: COURSE[cur].id } }, "*");
});
body.addEventListener("motion-end", e => {
  const c = COURSE[cur];
  if (!(e.detail && e.detail.stopped)) { playing = false; $("play").textContent = "Ещё раз"; $("bar").style.width = "100%"; done.add(c.id); saveDone(); drawList(); $("say").textContent = cur < COURSE.length - 1 ? "Урок пройден. Дальше: " + COURSE[cur + 1].title : "Курс пройден"; speak($("say").textContent); }
  if (window.parent !== window) window.parent.postMessage({ type: "body_event", event: "motion-end", detail: { ...e.detail, lesson: c.id } }, "*");
});
addEventListener("message", e => {
  const d = e.data; if (!d || d.type !== "body_command") return;
  let results; try { results = cmd.run(d.commands || d.command); } catch (err) { results = { ok: false, error: String(err.message || err) }; }
  if (e.source) e.source.postMessage({ type: "body_result", id: d.id, results }, e.origin === "null" ? "*" : e.origin);
});
setInterval(() => {
  if (!body.root) return; const S = body.spineState(), d = S.disc;
  $("gVal").textContent = `≈ ${d.mpa.toFixed(2).replace(".", ",")} МПа · ${d.pctOfStanding} % от стоя` + (d.load ? ` · груз ${Math.round(d.load)} кг` : "");
  $("gBar").style.width = Math.min(100, d.mpa / 2.4 * 100) + "%"; $("gBasis").textContent = d.basis;
  $("spinetext").textContent = playing ? "Позвоночник: " + ["cervical", "thoracic", "lumbar"].map(k => RN[k] + " — " + describe(S.regions[k])).join("; ") : "";
  if (body.anim) $("bar").style.width = Math.min(100, body.anim.t / body.anim.total * 100) + "%";
}, 250);

select(cur);
try {
  await body.load(p => ($("prog").style.width = Math.round(p * 100) + "%"));
  $("loading").hidden = true; body.live = true; body.peel("skin"); body.setShift(matchMedia("(max-width:820px)").matches ? 0 : .06);
  if (Q.get("autoplay") === "1") play();
} catch (err) { $("loading").querySelector("div").textContent = "Не удалось загрузить модель: " + (err.message || err); }
</script>
</body>
</html>
